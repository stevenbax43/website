{% extends 'home/base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'accounts/styles/accounts.css' %}">
{% endblock %}

{% block content %}
<div class="main-banner">
    <div class="main-banner-items">
        <div class="centered">
            <h1>Reset your password</h1>
            <p>Enter the email address registered to your account. If it matches, we will email you a reset link.</p>
            <form method="post" class="site-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Send reset link</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
